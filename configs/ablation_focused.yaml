# Shared keys (data_dir, artifacts_dir, require_test_split, training,
# hyperparameters.locked_params) live in configs/_base.yaml and are merged
# underneath this file by lib.config.load_config_with_base.
name: ablation_focused
description: "Ablation: focused sparsity only (no imbalanced patterns)"
output_dir: models/ablation_focused

sparsity:
  enabled: true
  focused: true
  include_mini_ipip: true
  include_imbalanced: false
  n_augmentation_passes: 3

hyperparameters:
  lock_policy: reference_model_hash
  reference_model_dir: models/reference

validation:
  min_pearson_r: 0.88
  min_coverage_90: 0.85
  per_domain:
    min_pearson_r: 0.85
    min_coverage_90: 0.82
  sparse_20:
    enabled: true
    min_pearson_r: 0.87
    min_coverage_90: 0.84
    per_domain:
      min_pearson_r: 0.80
      min_coverage_90: 0.78
