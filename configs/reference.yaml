# Shared keys (data_dir, artifacts_dir, require_test_split, training,
# hyperparameters.locked_params) live in configs/_base.yaml and are merged
# underneath this file by lib.config.load_config_with_base.
name: reference
description: "Published model: focused + Mini-IPIP + imbalanced sparsity"
output_dir: models/reference

sparsity:
  enabled: true
  focused: true
  include_mini_ipip: true
  include_imbalanced: true
  n_augmentation_passes: 3

hyperparameters:
  lock_policy: strict_data_hash

validation:
  min_pearson_r: 0.90
  min_coverage_90: 0.88
  per_domain:
    min_pearson_r: 0.90
    min_coverage_90: 0.88
  sparse_20:
    enabled: true
    min_pearson_r: 0.90
    min_coverage_90: 0.88
    per_domain:
      min_pearson_r: 0.85
      min_coverage_90: 0.84
