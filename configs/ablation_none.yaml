# Shared keys (data_dir, artifacts_dir, require_test_split, training,
# hyperparameters.locked_params) live in configs/_base.yaml and are merged
# underneath this file by lib.config.load_config_with_base.
name: ablation_none
description: "Ablation: no sparsity augmentation (baseline)"
output_dir: models/ablation_none

sparsity:
  enabled: false

hyperparameters:
  lock_policy: reference_model_hash
  reference_model_dir: models/reference

validation:
  min_pearson_r: 0.80
  min_coverage_90: 0.80
  per_domain:
    min_pearson_r: 0.74
    min_coverage_90: 0.72
  sparse_20:
    enabled: false
