# Shared defaults merged underneath every variant config by
# lib.config.load_config_with_base. Only keys that are byte-identical across
# reference/ablation_none/ablation_focused live here; variants override the rest
# (lock_policy, sparsity, validation, names) inline. Value-equivalent to the old
# standalone YAMLs (locked by tests/test_pipeline_regressions.py).
data_dir: data/processed/canonical_v1
artifacts_dir: artifacts

# Publication mode: fail closed if the held-out test split / split_metadata.json
# is missing (read by stage 07).
require_test_split: true

training:
  random_state: 42
  n_jobs: 16

hyperparameters:
  # The tuned hyperparameters witness; lock_policy (and reference_model_dir for
  # the ablations) stays in each variant since it differs.
  locked_params: artifacts/tuned_params.json
